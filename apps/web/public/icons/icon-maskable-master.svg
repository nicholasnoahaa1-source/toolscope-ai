<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>JARVIS</title>
  <!-- Zona segura de ícone "maskable": todo o conteúdo fica dentro de um
       círculo de raio 40% (102.4px) a partir do centro, conforme a
       especificação W3C de maskable icons, para não ser cortado por
       máscaras circulares/squircle do sistema operacional. -->
  <defs>
    <radialGradient id="bgm" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0c1720" />
      <stop offset="100%" stop-color="#04070a" />
    </radialGradient>
    <radialGradient id="nucleusm" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#eafcff" />
      <stop offset="100%" stop-color="#22c3e6" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgm)" />
  <g transform="translate(256,256) scale(0.54) translate(-256,-256)">
    <g fill="none" stroke="#22c3e6" stroke-linecap="round">
      <circle cx="256" cy="256" r="190" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="4 22" />
      <circle cx="256" cy="256" r="150" stroke-width="9" stroke-opacity="0.65" stroke-dasharray="70 26" />
      <circle cx="256" cy="256" r="108" stroke-width="15" stroke-opacity="0.5" stroke-dasharray="2 24" />
    </g>
    <circle cx="256" cy="256" r="62" fill="url(#nucleusm)" />
  </g>
</svg>
