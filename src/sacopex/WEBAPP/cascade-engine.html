<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SacoPex Cascade Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --creme: #F5F1EB;
      --navy: #1A2B3E;
      --navy-turtle: #2D4A5C;
      --laranja: #E89B7E;
      --white: #FFFFFF;
    }

    body {
      font-family: "Crimson Text", Georgia, serif;
      background: var(--creme);
      color: var(--navy);
      padding: 64px 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 64px;
    }

    .header h1 {
      font-family: "Manrope", sans-serif;
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .header p {
      font-size: 16px;
      font-style: italic;
      color: var(--navy-turtle);
      margin-bottom: 4px;
    }

    .input-section {
      background: var(--white);
      padding: 48px 40px;
      border-left: 4px solid var(--laranja);
      margin-bottom: 64px;
    }

    .input-group {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid rgba(26, 43, 62, 0.1);
      font-size: 15px;
      font-family: inherit;
      background: var(--creme);
      color: var(--navy);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--laranja);
      box-shadow: 0 0 0 2px rgba(232, 155, 126, 0.1);
    }

    button {
      padding: 14px 28px;
      background: var(--navy);
      color: var(--white);
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      font-family: "Manrope", sans-serif;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--navy-turtle);
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: transparent;
      color: var(--navy);
      border: 1px solid var(--navy);
      padding: 12px 20px;
      font-size: 13px;
    }

    button.secondary:hover {
      background: rgba(26, 43, 62, 0.05);
    }

    #insightsStatus {
      background: rgba(232, 155, 126, 0.1);
      border-left: 3px solid var(--laranja);
      padding: 12px 16px;
      border-radius: 2px;
      color: var(--navy);
    }

    #insightsStatus.active {
      display: block !important;
    }

    .input-section > div:last-child {
      font-size: 13px;
      color: var(--navy-turtle);
      margin-top: 16px;
      font-style: italic;
    }

    .cascade-view {
      display: none;
    }

    .cascade-view.active {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }

    .cascade-diagram {
      background: var(--white);
      border-left: 4px solid var(--laranja);
      padding: 40px 32px;
      font-size: 12px;
      font-family: monospace;
      line-height: 1.8;
      color: var(--navy);
      max-height: 600px;
      overflow-y: auto;
    }

    .cascade-diagram .complete { color: var(--laranja); font-weight: bold; }
    .cascade-diagram .pending { opacity: 0.4; }
    .cascade-diagram .arrow { color: var(--navy-turtle); }

    .output-section {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .artifact-card {
      background: var(--white);
      border-left: 4px solid var(--laranja);
      padding: 32px 28px;
      display: none;
    }

    .artifact-card.active {
      display: block;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .artifact-card h3 {
      font-family: "Manrope", sans-serif;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--navy);
    }

    .artifact-card .content {
      font-size: 14px;
      line-height: 1.7;
      color: var(--navy-turtle);
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 24px;
      color: var(--navy-turtle);
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--laranja);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background: #ffe0e0;
      border-left: 4px solid #d00;
      color: #c00;
      padding: 16px 20px;
      display: none;
      margin-bottom: 24px;
    }

    .error.active {
      display: block;
    }

    @media (max-width: 768px) {
      body {
        padding: 40px 16px;
      }

      .header {
        margin-bottom: 40px;
      }

      .header h1 {
        font-size: 36px;
      }

      .cascade-view.active {
        grid-template-columns: 1fr;
      }

      .input-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 SacoPex Cascade Engine</h1>
      <p>Uma ideia → 20+ peças de conteúdo automaticamente</p>
    </div>

    <div class="error" id="error"></div>

    <div class="input-section">
      <div class="input-group">
        <input type="text" id="ideaInput" placeholder="Ex: Quero lançar SacoPex Oreo" />
        <button onclick="generateCascade()">Gerar Cascata</button>
        <button class="secondary" onclick="loadAnalyticsInsights()" title="Carregar recomendações da Analytics Engine">💡 Carregar Insights</button>
      </div>
      <div style="font-size: 12px; color: var(--navy-turtle);">
        Escreva uma ideia simples. O engine extrai automaticamente produto, sabor e objetivo.
      </div>
      <div id="insightsStatus" style="margin-top: 12px; font-size: 13px; display: none;"></div>
    </div>

    <div class="cascade-view" id="cascadeView">
      <div class="cascade-diagram" id="cascadeDiagram"></div>
      <div class="output-section" id="outputSection"></div>
    </div>

    <div class="loading" id="loading">
      <span class="spinner"></span> Gerando cascata...
    </div>
  </div>

  <script>
    const BRAND = {
      palette: ['#F5F1EB', '#1A2B3E', '#2D4A5C', '#E89B7E'],
      paletteNames: ['Creme', 'Navy', 'Navy Tartaruga', 'Laranja Pastel'],
      fonts: ['Manrope', 'Tiempos Text Italic'],
      forbidden: {
        health: /emagrece|cura|trata|saudável|sem açúcar|diet|zero cal|caloria negativa/i,
        slang: /mano|véi|tipo assim|slk|mizeravi|c'mon|top|demais|brabo/i,
        competitor: /concorrente|marca X|diferente de|melhor que/i,
        falsepromises: /revolucionário|transforma|muda vidas|melhor do mundo/i
      },
      signature: 'SacoPex'
    };

    const PRODUTOS_DB = {
      'Oreo': {
        sabor: 'Oreo',
        angulo: 'Nostalgia sofisticada',
        publico: 'Millennials nostálgicos',
        corPrimaria: '#2D4A5C'
      },
      'Morango': {
        sabor: 'Morango',
        angulo: 'Frescor natural',
        publico: 'Público jovem',
        corPrimaria: '#E89B7E'
      }
    };

    const OBJETIVOS_MAP = {
      'lançar': { pilar: 'Antecipação', emoções: ['expectativa', 'surpresa'] },
      'vender': { pilar: 'Ação Imediata', emoções: ['urgência', 'desejo'] },
      'engajar': { pilar: 'Conversa', emoções: ['curiosidade', 'pertencimento'] },
      'descobrir': { pilar: 'Descoberta', emoções: ['encanto', 'curiosidade'] }
    };

    let cascadeState = {
      bigIdea: null,
      hooks: [],
      reels: [],
      stories: [],
      carousel: null,
      post: null,
      legendas: [],
      ads: [],
      abVariations: []
    };

    function parseIdea(text) {
      const lower = text.toLowerCase();
      let produto = 'SacoPex';
      let sabor = 'Oreo';
      let objetivo = 'lançar';

      if (lower.includes('oreo')) sabor = 'Oreo';
      else if (lower.includes('morango')) sabor = 'Morango';

      if (lower.includes('lançar')) objetivo = 'lançar';
      else if (lower.includes('vender')) objetivo = 'vender';
      else if (lower.includes('engajar')) objetivo = 'engajar';

      return { produto, sabor, objetivo };
    }

    function updateCascadeDiagram(step) {
      const steps = [
        { name: 'Big Idea', count: 1 },
        { name: 'Hooks', count: 3 },
        { name: 'Reels', count: 2 },
        { name: 'Stories', count: 3 },
        { name: 'Carrossel', count: 1 },
        { name: 'Post', count: 1 },
        { name: 'Legendas', count: 3 },
        { name: 'Anúncios', count: 2 },
        { name: 'A/B Variations', count: 3 }
      ];

      let diagram = 'INPUT: "' + document.getElementById('ideaInput').value + '"\n';
      diagram += '       ↓\n[PARSER]\n       ↓\n';

      steps.forEach((s, i) => {
        const isComplete = step > i;
        const isCurrent = step === i;
        const className = isComplete ? 'complete' : (isCurrent ? 'complete' : 'pending');

        diagram += `<span class="${className}">[${s.name} GERADOR]</span>\n`;
        diagram += `<span class="arrow">├─ ${s.count} ${s.name.toLowerCase()}</span>\n`;
        if (i < steps.length - 1) diagram += '       ↓\n';
      });

      diagram += '\nOUTPUT: 20+ PEÇAS ✓';
      document.getElementById('cascadeDiagram').innerHTML = diagram;
    }

    async function generateCascade() {
      const idea = document.getElementById('ideaInput').value.trim();
      if (!idea) {
        showError('Digite uma ideia para começar');
        return;
      }

      document.getElementById('cascadeView').classList.add('active');
      document.getElementById('loading').classList.add('active');

      const { produto, sabor, objetivo } = parseIdea(idea);
      const prodData = PRODUTOS_DB[sabor] || PRODUTOS_DB['Oreo'];
      const objData = OBJETIVOS_MAP[objetivo] || OBJETIVOS_MAP['lançar'];

      try {
        cascadeState = {
          bigIdea: null,
          hooks: [],
          reels: [],
          stories: [],
          carousel: null,
          post: null,
          legendas: [],
          ads: [],
          abVariations: []
        };

        // Step 1: Big Idea
        updateCascadeDiagram(0);
        await delay(600);
        cascadeState.bigIdea = generateBigIdea(prodData, objData);
        addOutput('big-idea', `BIG IDEA\n\n${cascadeState.bigIdea}`, 0);

        // Step 2: Hooks (3)
        updateCascadeDiagram(1);
        await delay(600);
        cascadeState.hooks = generateHooks(cascadeState.bigIdea, objData, 3);
        cascadeState.hooks.forEach((h, i) => {
          addOutput(`hook-${i}`, `HOOK ${i + 1}\n\n${h}`, i + 1);
        });

        // Step 3: Reels (2)
        updateCascadeDiagram(2);
        await delay(600);
        cascadeState.reels = generateReels(cascadeState.hooks, prodData, 2);
        cascadeState.reels.forEach((r, i) => {
          addOutput(`reel-${i}`, `REEL ${i + 1}\n\n${r}`, 4 + i);
        });

        // Step 4: Stories (3)
        updateCascadeDiagram(3);
        await delay(600);
        cascadeState.stories = generateStories(cascadeState.bigIdea, prodData, 3);
        cascadeState.stories.forEach((s, i) => {
          addOutput(`story-${i}`, `STORY ${i + 1}\n\n${s}`, 6 + i);
        });

        // Step 5: Carrossel
        updateCascadeDiagram(4);
        await delay(600);
        cascadeState.carousel = generateCarousel(cascadeState.bigIdea, cascadeState.hooks);
        addOutput('carousel', `CARROSSEL (5 SLIDES)\n\n${cascadeState.carousel}`, 9);

        // Step 6: Post
        updateCascadeDiagram(5);
        await delay(600);
        cascadeState.post = generatePost(cascadeState.bigIdea, prodData);
        addOutput('post', `POST FEED\n\n${cascadeState.post}`, 10);

        // Step 7: Legendas (3)
        updateCascadeDiagram(6);
        await delay(600);
        cascadeState.legendas = generateLegendas(cascadeState.bigIdea, 3);
        cascadeState.legendas.forEach((l, i) => {
          addOutput(`legenda-${i}`, `LEGENDA ${i + 1}\n\n${l}`, 11 + i);
        });

        // Step 8: Anúncios (2)
        updateCascadeDiagram(7);
        await delay(600);
        cascadeState.ads = generateAds(cascadeState.hooks, 2);
        cascadeState.ads.forEach((a, i) => {
          addOutput(`ad-${i}`, `ANÚNCIO ${i + 1}\n\n${a}`, 14 + i);
        });

        // Step 9: A/B Variations (3)
        updateCascadeDiagram(8);
        await delay(600);
        cascadeState.abVariations = generateABVariations(cascadeState.bigIdea, 3);
        cascadeState.abVariations.forEach((v, i) => {
          addOutput(`ab-${i}`, `VARIAÇÃO A/B ${i + 1}\n\n${v}`, 16 + i);
        });

        document.getElementById('loading').classList.remove('active');
      } catch (e) {
        showError('Erro ao gerar cascata: ' + e.message);
        document.getElementById('loading').classList.remove('active');
      }
    }

    function generateBigIdea(prodData, objData) {
      const templates = [
        `Quando ${objData.emoções[0]} é sofisticada`,
        `${prodData.sabor} nunca foi tão ${prodData.angulo.split(' ')[0].toLowerCase()}`,
        `O momento em que ${objData.emoções[1]} encontra qualidade`
      ];
      return templates[Math.floor(Math.random() * templates.length)];
    }

    function generateHooks(bigIdea, objData, count) {
      const base = bigIdea;
      return [
        base,
        `Aquele momento em que ${objData.emoções[0]} bate sofisticada`,
        `Você merecia isso: ${base.toLowerCase()}`
      ].slice(0, count);
    }

    function generateReels(hooks, prodData, count) {
      return hooks.slice(0, count).map((hook, i) =>
        `REEL ${i + 1}\n` +
        `Hook: "${hook}"\n` +
        `Duração: 15-22s\n` +
        `Cena 1 (0-3s): Still-life ${prodData.sabor} sobre fundo Creme\n` +
        `Cena 2 (3-10s): Close-up textura, gelo derretendo\n` +
        `Cena 3 (10-15s): Mão consumindo, bokeh background\n` +
        `Cena 4 (15-20s): Card Navy com oferta\n` +
        `Cena 5 (20-22s): Assinatura SacoPex, fade to black`
      );
    }

    function generateStories(bigIdea, prodData, count) {
      const templates = [
        `Story 1: "Expectativa"\n${bigIdea}\n\n→ Clique para ver`,
        `Story 2: "Revelação"\n${prodData.sabor} chegou com tudo\n\n→ Peça já`,
        `Story 3: "CTA"\n2 por R$10\n\n→ Link na bio`
      ];
      return templates.slice(0, count);
    }

    function generateCarousel(bigIdea, hooks) {
      return `SLIDE 1: ${bigIdea}\nSLIDE 2: ${hooks[0]}\nSLIDE 3: Benefícios\nSLIDE 4: Oferta\nSLIDE 5: CTA + Hashtags`;
    }

    function generatePost(bigIdea, prodData) {
      return `${bigIdea}.\n\n${prodData.sabor} nunca foi tão sofisticado. Sacolé SacoPex: qualidade sem compromisos.\n\n2 por R$10. Peça o seu.\n\n#SacoPex #${prodData.sabor} #MomentoSofisticado`;
    }

    function generateLegendas(bigIdea, count) {
      return [
        `${bigIdea}. Peça o seu.`,
        `Quando sofisticação é simples. SacoPex Oreo 2x R$10`,
        `Nostalgia sofisticada. Qualidade que você merecia, preço que você aprecia.`
      ].slice(0, count);
    }

    function generateAds(hooks, count) {
      return hooks.slice(0, count).map((h, i) =>
        `ANÚNCIO ${i + 1}\nHeadline: "${h}"\nBody: Sacolé SacoPex. Qualidade premium, preço acessível.\nCTA: Peça Agora\nOferta: 2 por R$10`
      );
    }

    function generateABVariations(bigIdea, count) {
      return [
        `Variação A: Emocional\n"${bigIdea}"`,
        `Variação B: Racional\n"2 por R$10 — melhor preço do mercado"`,
        `Variação C: Urgência\n"Antes que derreta — peça agora"`
      ].slice(0, count);
    }

    function addOutput(id, content, index) {
      const section = document.getElementById('outputSection');
      const card = document.createElement('div');
      card.className = 'artifact-card';
      card.id = `card-${id}`;
      card.innerHTML = `
        <h3>${id.replace(/-/g, ' ').toUpperCase()}</h3>
        <div class="content">${content}</div>
      `;
      section.appendChild(card);
      setTimeout(() => card.classList.add('active'), 50);
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.add('active');
      setTimeout(() => el.classList.remove('active'), 5000);
    }

    function delay(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    // ============================================
    // PHASE 2: ANALYTICS INTEGRATION
    // ============================================
    let analyticsInsights = null;

    async function loadAnalyticsInsights() {
      try {
        const db = await new Promise((resolve, reject) => {
          const req = indexedDB.open('sacopex-analytics');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });

        const tx = db.transaction('metrics-collected', 'readonly');
        const store = tx.objectStore('metrics-collected');
        const metricsReq = store.getAll();

        metricsReq.onsuccess = () => {
          if (metricsReq.result.length > 0) {
            const engine = new AnalyticsEngine(db);
            Promise.all([
              engine.getHookPerformance(),
              engine.getFormatPerformance(),
              engine.getConversionDrivers(),
              engine.getGenerationRecommendations()
            ]).then(([hooks, formats, drivers, recommendations]) => {
              analyticsInsights = { hooks, formats, drivers, recommendations };
              document.getElementById('insightsStatus').innerHTML =
                `✓ Insights carregados: Top Hook=${hooks[0]?.hookType || 'N/A'}, Top Format=${formats[0]?.format || 'N/A'}`;
              document.getElementById('insightsStatus').classList.add('active');
            });
          } else {
            alert('Nenhuma métrica encontrada. Gere e publique conteúdo primeiro.');
          }
        };
      } catch (e) {
        alert('Erro ao carregar insights: ' + e.message);
      }
    }

    function generateHooksWithInsights(bigIdea, objData, count) {
      if (!analyticsInsights?.hooks || analyticsInsights.hooks.length === 0) {
        return generateHooks(bigIdea, objData, count);
      }

      const topHook = analyticsInsights.hooks[0];
      const hookTemplates = {
        'curiosidade': [`${bigIdea}: você não vai acreditar`,
                        `Espera só: ${bigIdea}`,
                        `Verdade ou mito? ${bigIdea}`],
        'humor': [`${bigIdea} — sim, de verdade!`,
                  `Quando ${objData.emoções[0]} vira comédia`,
                  `A risada que você não esperava`],
        'shock': [`⚠️ ${bigIdea}`,
                  `VERDADE: ${bigIdea}`,
                  `Você não sabia disso sobre qualidade`],
        'benefício': [`Como ${bigIdea} muda sua vida`,
                      `O benefício secreto: ${bigIdea}`,
                      `Seus amigos não querem que você saiba`],
        'unboxing': [`Abrindo ${bigIdea}`,
                     `First Look: ${bigIdea}`,
                     `O que tem dentro é incrível`],
        'tutorial': [`Aprenda: ${bigIdea}`,
                     `Passo a passo para ${bigIdea}`,
                     `Como dominar ${bigIdea}`],
        'trending': [`#TrendingAgora: ${bigIdea}`,
                     `Todos estão falando sobre: ${bigIdea}`,
                     `O que está bombando: ${bigIdea}`]
      };

      const templates = hookTemplates[topHook.hookType] || hookTemplates['genérico'] ||
        [`${bigIdea}`, `Aquele momento em que ${objData.emoções[0]} é sofisticada`, `Você merecia isso: ${bigIdea.toLowerCase()}`];

      return templates.slice(0, count);
    }

    function generateReelsWithInsights(hooks, prodData, count) {
      if (!analyticsInsights?.formats || analyticsInsights.formats.length === 0) {
        return generateReels(hooks, prodData, count);
      }

      const topFormat = analyticsInsights.formats[0];
      if (topFormat.format !== 'reel') {
        return generateReels(hooks, prodData, count);
      }

      return hooks.slice(0, count).map((hook, i) => {
        const scenes = [
          '1️⃣ Hook: "' + hook + '"',
          '2️⃣ Problema: Qualidade que você procura',
          '3️⃣ Solução: ' + prodData.sabor,
          '4️⃣ Prova: Veja a diferença',
          '5️⃣ CTA: 2 por R$10 — pede agora'
        ];
        return `REEL ${i + 1}\n${scenes.join('\n')}\nDuração: 15-22s`;
      });
    }

    function generateStoriesWithInsights(bigIdea, prodData, count) {
      if (!analyticsInsights?.formats || analyticsInsights.formats.length === 0) {
        return generateStories(bigIdea, prodData, count);
      }

      const topFormat = analyticsInsights.formats[0];
      if (topFormat.format !== 'story') {
        return generateStories(bigIdea, prodData, count);
      }

      return Array(count).fill(0).map((_, i) =>
        `STORY ${i + 1}\n[Frame 1] ${bigIdea}\n[Frame 2] Problema: Qualidade é cara?\n[Frame 3] NÃO AQUI: ${prodData.sabor}\n[Frame 4] TOQUE AQUI: Saiba mais`
      );
    }

    const originalGenerateCascade = generateCascade;
    async function generateCascade() {
      if (!analyticsInsights) {
        return originalGenerateCascade();
      }

      const ideaInput = document.getElementById('ideaInput');
      if (!ideaInput.value.trim()) {
        showError('Escreva uma ideia para a cascata');
        return;
      }

      document.getElementById('loading').classList.add('active');
      document.getElementById('outputSection').innerHTML = '';
      document.getElementById('error').classList.remove('active');

      try {
        const prodData = PRODUTOS_DB[ideaInput.value.split(',')[0].trim()] || PRODUTOS_DB.PADRÃO;
        const objData = OBJETIVOS_MAP['geral'] || OBJETIVOS_MAP.VENDER;
        const cascadeState = {
          bigIdea: '',
          hooks: [],
          reels: [],
          stories: [],
          carousel: '',
          post: '',
          legendas: [],
          ads: [],
          abVariations: []
        };

        updateCascadeDiagram(0);
        await delay(600);
        cascadeState.bigIdea = generateBigIdea(prodData, objData);
        addOutput('big-idea', `BIG IDEA\n\n${cascadeState.bigIdea}`, 0);

        updateCascadeDiagram(1);
        await delay(600);
        cascadeState.hooks = generateHooksWithInsights(cascadeState.bigIdea, objData, 3);
        cascadeState.hooks.forEach((h, i) => {
          addOutput(`hook-${i}`, `HOOK ${i + 1}\n\n${h}`, i + 1);
        });

        updateCascadeDiagram(2);
        await delay(600);
        cascadeState.reels = generateReelsWithInsights(cascadeState.hooks, prodData, 2);
        cascadeState.reels.forEach((r, i) => {
          addOutput(`reel-${i}`, `REEL ${i + 1}\n\n${r}`, 4 + i);
        });

        updateCascadeDiagram(3);
        await delay(600);
        cascadeState.stories = generateStoriesWithInsights(cascadeState.bigIdea, prodData, 3);
        cascadeState.stories.forEach((s, i) => {
          addOutput(`story-${i}`, `STORY ${i + 1}\n\n${s}`, 6 + i);
        });

        updateCascadeDiagram(4);
        await delay(600);
        cascadeState.carousel = generateCarousel(cascadeState.bigIdea, cascadeState.hooks);
        addOutput('carousel', `CARROSSEL (5 SLIDES)\n\n${cascadeState.carousel}`, 9);

        updateCascadeDiagram(5);
        await delay(600);
        cascadeState.post = generatePost(cascadeState.bigIdea, prodData);
        addOutput('post', `POST FEED\n\n${cascadeState.post}`, 10);

        updateCascadeDiagram(6);
        await delay(600);
        cascadeState.legendas = generateLegendas(cascadeState.bigIdea, 3);
        cascadeState.legendas.forEach((l, i) => {
          addOutput(`legenda-${i}`, `LEGENDA ${i + 1}\n\n${l}`, 11 + i);
        });

        updateCascadeDiagram(7);
        await delay(600);
        cascadeState.ads = generateAds(cascadeState.hooks, 2);
        cascadeState.ads.forEach((a, i) => {
          addOutput(`ad-${i}`, `ANÚNCIO ${i + 1}\n\n${a}`, 14 + i);
        });

        updateCascadeDiagram(8);
        await delay(600);
        cascadeState.abVariations = generateABVariations(cascadeState.bigIdea, 3);
        cascadeState.abVariations.forEach((v, i) => {
          addOutput(`ab-${i}`, `VARIAÇÃO A/B ${i + 1}\n\n${v}`, 16 + i);
        });

        document.getElementById('loading').classList.remove('active');
      } catch (e) {
        showError('Erro ao gerar cascata: ' + e.message);
        document.getElementById('loading').classList.remove('active');
      }
    }

    document.getElementById('ideaInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') generateCascade();
    });
  </script>

  <script src="analytics-engine.js"></script>
</body>
</html>
